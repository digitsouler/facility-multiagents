<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ReAct Agent + Reflect 自纠错循环</title>
  <desc>Thought-Action-Observe-Reflect 的完整推理循环</desc>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.3" stroke-linecap="round"/></marker>
    <marker id="rr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.3" stroke-linecap="round"/></marker>
    <marker id="rg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.3" stroke-linecap="round"/></marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" class="th" style="font-size:15px">ReAct Agent + Reflect 自纠错循环</text>

  <!-- Thought (top) -->
  <g class="node c-purple">
    <rect x="260" y="52" width="160" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="76" text-anchor="middle" dominant-baseline="central" class="th" fill="#26215C">Thought 思考</text>
    <text x="340" y="96" text-anchor="middle" dominant-baseline="central" class="ts" fill="#3C3489">LLM 推理 / 故障分析</text>
  </g>

  <!-- Action (right) -->
  <g class="node c-blue">
    <rect x="480" y="175" width="160" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="560" y="199" text-anchor="middle" dominant-baseline="central" class="th" fill="#042C53">Action 行动</text>
    <text x="560" y="219" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0C447C">调用工具 / 检索 / 派单</text>
  </g>

  <!-- Observe (bottom) -->
  <g class="node c-teal">
    <rect x="260" y="300" width="160" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="324" text-anchor="middle" dominant-baseline="central" class="th" fill="#04342C">Observe 观察</text>
    <text x="340" y="344" text-anchor="middle" dominant-baseline="central" class="ts" fill="#085041">读取返回 / 结果校验</text>
  </g>

  <!-- Reflect (left) -->
  <g class="node c-coral">
    <rect x="40" y="175" width="160" height="56" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="120" y="199" text-anchor="middle" dominant-baseline="central" class="th" fill="#4A1B0C">Reflect 反思</text>
    <text x="120" y="219" text-anchor="middle" dominant-baseline="central" class="ts" fill="#712B13">质量评分 → 重试/继续</text>
  </g>

  <!-- Cycle arrows -->
  <path d="M400 88 Q 480 88 520 169" fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ra)"/>
  <path d="M560 231 Q 560 280 420 316" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#ra)"/>
  <path d="M280 328 Q 180 328 140 237" fill="none" stroke="#993C1D" stroke-width="1.3" marker-end="url(#rr)"/>
  <path d="M120 175 Q 120 120 256 92" fill="none" stroke="#534AB7" stroke-width="1.3" marker-end="url(#ra)"/>

  <!-- Center label -->
  <circle cx="340" cy="204" r="32" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="200" text-anchor="middle" dominant-baseline="central" class="th" fill="#444441" style="font-size:12px">Agent</text>
  <text x="340" y="216" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Loop</text>

  <!-- Retry arrow from Reflect back to Thought (curved outside, no overlap with input) -->
  <path d="M40 195 Q -20 130 252 76" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#rr)"/>
  <text x="90" y="52" text-anchor="middle" class="ts" fill="#A32D2D">评分不达标 → 重试</text>

  <!-- User input (moved left and down to avoid overlap) -->
  <g class="node c-gray">
    <rect x="16" y="300" width="124" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="78" y="320" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">用户输入</text>
  </g>
  <path d="M140 310 Q 200 310 256 100" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#ra)"/>

  <!-- Output from Observe to final -->
  <path d="M420 340 Q 500 370 560 384" fill="none" stroke="#3B6D11" stroke-width="1.3" marker-end="url(#rg)"/>
  <g class="node c-green">
    <rect x="480" y="376" width="160" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="560" y="394" text-anchor="middle" dominant-baseline="central" class="th" fill="#173404">输出结果</text>
  </g>
  <text x="508" y="365" text-anchor="middle" class="ts" fill="#3B6D11">评分通过 → 输出</text>
</svg>