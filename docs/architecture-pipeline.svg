<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FacilityMind 核心闭环 + 记忆反哺</title>
  <desc>主流程管线与四大记忆系统的交互关系</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#993556" stroke-width="1.2" stroke-linecap="round"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-linecap="round"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-linecap="round"/></marker>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-linecap="round"/></marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" class="th" style="font-size:15px">FacilityMind 核心闭环 + 记忆反哺</text>

  <!-- Main pipeline nodes -->
  <g class="node c-blue"><rect x="60" y="52" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="130" y="74" text-anchor="middle" dominant-baseline="central" class="th" fill="#042C53">受理 Intake</text></g>
  <g class="node c-blue"><rect x="60" y="112" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="130" y="134" text-anchor="middle" dominant-baseline="central" class="th" fill="#042C53">诊断 Diagnose</text></g>
  <g class="node c-blue"><rect x="60" y="172" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="130" y="194" text-anchor="middle" dominant-baseline="central" class="th" fill="#042C53">派单 Dispatch</text></g>
  <g class="node c-amber"><rect x="60" y="232" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="130" y="254" text-anchor="middle" dominant-baseline="central" class="th" fill="#412402">审批 Approval</text></g>
  <g class="node c-amber"><rect x="60" y="292" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="130" y="314" text-anchor="middle" dominant-baseline="central" class="th" fill="#412402">师傅回传</text></g>
  <g class="node c-amber"><rect x="60" y="352" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="130" y="374" text-anchor="middle" dominant-baseline="central" class="th" fill="#412402">质检 QA</text></g>
  <g class="node c-green"><rect x="60" y="412" width="140" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="130" y="434" text-anchor="middle" dominant-baseline="central" class="th" fill="#173404">结案 Report</text></g>

  <!-- Main flow arrows -->
  <line x1="130" y1="96" x2="130" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="130" y1="156" x2="130" y2="168" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="130" y1="216" x2="130" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="130" y1="276" x2="130" y2="288" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="130" y1="336" x2="130" y2="348" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="130" y1="396" x2="130" y2="408" stroke="#888780" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Memory systems (right side) -->
  <g class="node c-red"><rect x="480" y="52" width="170" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="565" y="74" text-anchor="middle" dominant-baseline="central" class="th" fill="#501313">新问题查证 → 人工</text></g>
  <g class="node c-amber"><rect x="480" y="132" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="565" y="152" text-anchor="middle" dominant-baseline="central" class="th" fill="#412402">Redis 口碑分</text><text x="565" y="170" text-anchor="middle" dominant-baseline="central" class="ts" fill="#633806">reputation 实时算</text></g>
  <g class="node c-teal"><rect x="480" y="212" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="565" y="232" text-anchor="middle" dominant-baseline="central" class="th" fill="#04342C">Qdrant 案例库</text><text x="565" y="250" text-anchor="middle" dominant-baseline="central" class="ts" fill="#085041">好/坏案例向量</text></g>
  <g class="node c-purple"><rect x="480" y="292" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="565" y="312" text-anchor="middle" dominant-baseline="central" class="th" fill="#26215C">preventions 预防</text><text x="565" y="330" text-anchor="middle" dominant-baseline="central" class="ts" fill="#3C3489">按 fault_type 规则</text></g>

  <!-- Feedback arrows -->
  <path d="M200 64 Q 340 54 476 68" fill="none" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a2)"/>
  <text x="330" y="56" text-anchor="middle" class="ts" fill="#993556">KB 缺失 → 查证</text>
  <path d="M200 128 Q 350 100 476 148" fill="none" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a5)"/>
  <text x="340" y="112" text-anchor="middle" class="ts" fill="#993C1D">性价比排序</text>
  <path d="M480 172 Q 340 180 204 140" fill="none" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a5)"/>
  <path d="M200 188 Q 360 200 476 228" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <text x="340" y="198" text-anchor="middle" class="ts" fill="#0F6E56">召回好案例</text>
  <path d="M480 248 Q 350 240 204 196" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <path d="M200 368 Q 380 340 476 312" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a4)"/>
  <text x="340" y="338" text-anchor="middle" class="ts" fill="#534AB7">写预防</text>
  <path d="M480 332 Q 320 370 204 364" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a4)"/>
  <text x="340" y="376" text-anchor="middle" class="ts" fill="#534AB7">预警提示存口碑</text>
  <path d="M200 430 Q 380 400 476 250" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <text x="320" y="392" text-anchor="middle" class="ts" fill="#0F6E56">存案例</text>

  <!-- Legend -->
  <rect x="60" y="476" width="590" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.3"/>
  <text x="80" y="496" dominant-baseline="central" class="ts" fill="#444441">实线 = 主流程驱动</text>
  <text x="220" y="496" dominant-baseline="central" class="ts" fill="#444441">虚线 = 记忆读写 / 反哺</text>
  <text x="380" y="496" dominant-baseline="central" class="ts" fill="#444441">每轮结案 → 系统更聪明</text>
</svg>